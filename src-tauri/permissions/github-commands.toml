[[permission]]
identifier = "github-commands"
description = "GitHub CLI (gh) commands for auth, remotes, and pull requests"
commands.allow = [
  "gh_auth_status",
  "gh_auth_login",
  "gh_auth_cancel",
  "gh_auth_logout",
  "git_github_remote",
  "git_github_owner",
  "git_github_repo_owner",
  "gh_repo_name_check",
  "gh_list_owners",
  "gh_list_repos",
  "default_clone_parent",
  "gh_pr_create_web",
  "gh_pr_view",
  "gh_pr_merge_method",
  "gh_pr_merge",
  "open_external",
]
