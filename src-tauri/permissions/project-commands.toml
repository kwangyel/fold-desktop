[[permission]]
identifier = "project-commands"
description = "Project create/open/list/select commands"
commands.allow = [
  "list_projects",
  "create_project",
  "open_project",
  "clone_github_project",
  "is_git_repo",
  "set_active_project",
  "scan_worktree_env",
  "create_worktree",
  "set_active_worktree",
  "remove_project",
  "remove_worktree",
  "archive_worktree",
]
