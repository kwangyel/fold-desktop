[[permission]]
identifier = "git-commands"
description = "Git and filesystem commands for the Changes tab"
commands.allow = [
  "git_changes",
  "git_file_diff",
  "git_discard",
  "git_stage",
  "git_unstage",
  "git_stage_all",
  "git_unstage_all",
  "git_commit",
  "git_push",
  "git_staged_diff",
  "git_list_branches",
  "git_head_commit",
  "git_changed_since",
  "list_dir",
  "read_file",
  "write_file",
]
