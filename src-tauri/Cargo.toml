[package]
name = "fold"
version = "0.1.0"
description = "Fold"
authors = ["you"]
edition = "2021"

[lib]
name = "fold_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-prevent-default = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
window-vibrancy = "0.6"
# `bundled` compiles SQLite in-tree so chat storage does not depend on a
# system libsqlite3 being present on the user's machine.
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "json"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
