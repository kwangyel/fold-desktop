[package]
name = "fold"
version = "0.1.0"
description = "Fold"
authors = ["you"]
edition = "2021"

[lib]
name = "fold_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
window-vibrancy = "0.6"

[features]
custom-protocol = ["tauri/custom-protocol"]
