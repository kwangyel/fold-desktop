name: Release

# Build, sign, notarize, and publish a macOS release + updater manifest when a
# version tag is pushed. See scripts/bump-version.mjs for the bump/tag flow.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.2.0)"
        required: true

jobs:
  release-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust (Apple Silicon + Intel targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: npm ci

      - name: Build, sign & upload (draft release)
        uses: tauri-apps/tauri-action@v0
        env:
          # Updater signing (minisign) — proves update integrity; verified in
          # the app against `plugins.updater.pubkey` in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing + notarization (Gatekeeper).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          releaseName: "Fold __VERSION__"
          releaseDraft: true
          prerelease: false
          # Universal binary → the updater manifest covers both Mac archs.
          args: --target universal-apple-darwin

      # tauri-action generates a standard latest.json; add our custom
      # `minimumSupported` policy field (the compulsory-update lever).
      - name: Inject minimumSupported into latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          MIN="$(tr -d '[:space:]' < .github/minimum-supported-version.txt)"
          gh release download "$TAG" --pattern latest.json --output latest.json --clobber
          jq --arg min "$MIN" '. + { minimumSupported: $min }' latest.json > latest.patched.json
          gh release upload "$TAG" latest.patched.json#latest.json --clobber
          echo "minimumSupported set to $MIN"

      # Versioned DMG names (Fold_1.0.0_x64.dmg) break /latest/download/… on the
      # next release. Re-upload a stable Fold.dmg so the website can always use
      # https://github.com/kwangyel/fold-desktop/releases/latest/download/Fold.dmg
      - name: Upload stable Fold.dmg alias
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          mkdir -p /tmp/fold-dmg
          gh release download "$TAG" --pattern "Fold_*.dmg" --dir /tmp/fold-dmg --clobber
          SRC="$(find /tmp/fold-dmg -name 'Fold_*.dmg' -print | head -n 1)"
          test -n "$SRC"
          cp "$SRC" /tmp/fold-dmg/Fold.dmg
          gh release upload "$TAG" /tmp/fold-dmg/Fold.dmg --clobber
          echo "Uploaded Fold.dmg from $(basename "$SRC")"

  # Linux build: produces a portable AppImage attached to the same draft release.
  # Download-only — deliberately does NOT touch latest.json (the macOS updater
  # manifest), so `includeUpdaterJson: false` below.
  release-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri + AppImage system dependencies (webkit2gtk, appindicator, patchelf…).
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install JS dependencies
        run: npm ci

      - name: Build & upload AppImage (draft release)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          releaseName: "Fold __VERSION__"
          releaseDraft: true
          prerelease: false
          # Only build the AppImage; skip .deb/.rpm.
          # createUpdaterArtifacts is true in tauri.conf.json (for macOS
          # auto-update). On Linux that requires TAURI_SIGNING_PRIVATE_KEY even
          # though we never publish latest.json from this job — disable it so
          # the AppImage can upload as a plain download.
          args: --bundles appimage --config '{"bundle":{"createUpdaterArtifacts":false}}'
          # Do not upload/overwrite latest.json — Linux is download-only and the
          # macOS updater manifest must stay intact.
          includeUpdaterJson: false

      # Versioned AppImage names (Fold_1.0.0_amd64.AppImage) break /latest/download/…
      # on the next release. Re-upload a stable Fold.AppImage so the website/README can
      # always use
      # https://github.com/kwangyel/fold-desktop/releases/latest/download/Fold.AppImage
      - name: Upload stable Fold.AppImage alias
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          mkdir -p /tmp/fold-appimage
          gh release download "$TAG" --pattern "*.AppImage" --dir /tmp/fold-appimage --clobber
          SRC="$(find /tmp/fold-appimage -name '*.AppImage' -print | head -n 1)"
          test -n "$SRC"
          cp "$SRC" /tmp/fold-appimage/Fold.AppImage
          gh release upload "$TAG" /tmp/fold-appimage/Fold.AppImage --clobber
          echo "Uploaded Fold.AppImage from $(basename "$SRC")"

  # Publish only after both platform builds have attached their artifacts, so the
  # released version always has both the DMG and the AppImage.
  publish:
    needs: [release-macos, release-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          gh release edit "$TAG" --draft=false
